spring.application.name=expense-tracker

spring.datasource.url=jdbc:mysql://localhost:3306/expense_tracker?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema, Hibernate only validates it
# (if validation ever complains about a column type, temporarily use: none)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true

# JWT (override JWT_SECRET in production; must be 32+ characters)
app.jwt.secret=${JWT_SECRET:ledgerly-dev-secret-change-me-0123456789}
app.jwt.expiration-ms=86400000

server.port=8080
